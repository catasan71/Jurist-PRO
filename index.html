<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <script>
    // Safeguard to prevent benign third-party/sandbox-induced cross-origin errors from bubbling to the platform host
    window.addEventListener('error', function(event) {
      if (
        event.message === 'Script error.' || 
        event.message === 'Script error' || 
        !event.filename
      ) {
        event.stopImmediatePropagation();
        event.preventDefault();
        return true;
      }
    }, true);
    window.onerror = function(message, source, lineno, colno, error) {
      if (
        message === 'Script error.' || 
        message === 'Script error' || 
        (!source && !lineno)
      ) {
        return true;
      }
    };
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover">
  <title>JuristPRO AI</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23111111'/><text x='50%' y='50%' font-family='sans-serif' font-size='65' font-weight='bold' fill='%23FF8C00' text-anchor='middle' dominant-baseline='central'>J</text></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            jurist: {
              black: '#0a0a0a',
              dark: '#111111',
              card: '#1a1a1a',
              orange: '#FF8C00',
              orangeHover: '#FFA500',
              text: '#e5e5e5',
              muted: '#a3a3a3'
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          boxShadow: {
            'neon': '0 0 10px rgba(255, 140, 0, 0.3)',
            'neon-strong': '0 0 20px rgba(255, 140, 0, 0.6)',
          },
          animation: {
            fadeIn: 'fadeIn 0.5s ease-out forwards',
            slideUp: 'slideUp 0.5s ease-out forwards',
            slideDown: 'slideDown 0.5s ease-out forwards',
            pulse: 'pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            bounce: 'bounce 1s infinite'
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0' },
              '100%': { opacity: '1' },
            },
            slideUp: {
              '0%': { transform: 'translateY(20px)', opacity: '0' },
              '100%': { transform: 'translateY(0)', opacity: '1' },
            },
            slideDown: {
              '0%': { transform: 'translateY(-20px)', opacity: '0' },
              '100%': { transform: 'translateY(0)', opacity: '1' },
            }
          }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    html, body {
      background-color: #0a0a0a;
      color: #e5e5e5;
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow-x: hidden;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: pan-y;
    }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #111; border-radius: 4px; }
    ::-webkit-scrollbar-thumb { background: #FF8C00; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #FFA500; }
    .glass-panel { background: rgba(26, 26, 26, 0.8); backdrop-filter: blur(10px); }
    
    /* Utility clasa pt scroll orizontal vizibil pe mobil */
    .custom-scrollbar-orange {
       scrollbar-width: thin;
       scrollbar-color: #FF8C00 #1a1a1a;
       -webkit-overflow-scrolling: touch;
    }
    .custom-scrollbar-orange::-webkit-scrollbar { 
       height: 8px; 
       -webkit-appearance: none;
       display: block;
    }
    .custom-scrollbar-orange::-webkit-scrollbar-track { 
       background: #1a1a1a; 
       border-radius: 4px;
       margin: 0px 4px;
    }
    .custom-scrollbar-orange::-webkit-scrollbar-thumb { 
       background: #FF8C00; 
       border-radius: 4px; 
    }
  </style>
</head>
<body>
  <app-root></app-root>
</body>
</html>
